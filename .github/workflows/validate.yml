name: Validate

on:
  push:
    paths:
      - "problems/**"
      - "templates/**"
      - "scripts/validate.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "problems/**"
      - "templates/**"
      - "scripts/validate.py"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    name: Validate structure & metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate repository
        run: python scripts/validate.py