name: Generate README & Dashboard

on:
  push:
    branches: [main]
    paths:
      - "problems/**"
      - "scripts/scanner.py"
      - "scripts/stats.py"
      - "scripts/formatters.py"
      - "scripts/build_site.py"
      - "scripts/generate_readme.py"
      - "scripts/generate_dashboard.py"
      - ".github/workflows/generate.yml"

jobs:
  generate:
    name: Regenerate README, dashboard, and site data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for streak computation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate dashboard JSON
        run: python scripts/generate_dashboard.py

      - name: Build site data
        run: python scripts/build_site.py

      - name: Regenerate README
        run: python scripts/generate_readme.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md dashboard/stats.json site/data/stats.json
          if git diff --staged --quiet; then
            echo "Everything is up to date — nothing to commit."
          else
            git commit -m "docs: auto-regenerate README, dashboard, and site data from metadata"
            git push
          fi
