name: Verify generated files

on:
  push:
    branches: [main]
    paths:
      - "problems/**"
      - "scripts/scanner.py"
      - "scripts/stats.py"
      - "scripts/formatters.py"
      - "scripts/build_site.py"
      - "scripts/generate_readme.py"
      - "scripts/generate_dashboard.py"
      - ".github/workflows/generate.yml"
  pull_request:
    branches: [main]
    paths:
      - "problems/**"
      - "scripts/scanner.py"
      - "scripts/stats.py"
      - "scripts/formatters.py"
      - "scripts/build_site.py"
      - "scripts/generate_readme.py"
      - "scripts/generate_dashboard.py"
      - ".github/workflows/generate.yml"

jobs:
  verify:
    name: Check generated files are up-to-date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for streak computation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate all generated files
        run: |
          python scripts/generate_dashboard.py
          python scripts/build_site.py
          python scripts/generate_readme.py

      - name: Verify no changes needed
        run: |
          git add README.md dashboard/stats.json site/data/stats.json
          if git diff --staged --quiet; then
            echo "All generated files are up to date."
          else
            echo "::error::Generated files are out of date. Run the CLI (sp) or the generation scripts locally before pushing."
            git diff --staged
            exit 1
          fi